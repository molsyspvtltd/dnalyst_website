# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/health_tracker
spring.datasource.username=root
spring.datasource.password=Molsys@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
# Server
server.port=8080

# JWT Configuration
jwt.secret=your-very-secure-jwt-secret-key-with-at-least-256-bits
jwt.expiration=86400

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.healthtracker=DEBUG